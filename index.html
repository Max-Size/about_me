<!doctype html>
<html lang="ru" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Портфолио Максима Селезнева — Software Engineer: мобильные приложения, веб и бэкенд с нуля" />
    <meta name="theme-color" content="#0d0b08" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Максим Селезнев · Software Engineer</title>
    <script>
      (function () {
        var key = 'cutaway-locale'
        var stored = null
        try {
          stored = localStorage.getItem(key)
        } catch (e) {}
        var query = new URLSearchParams(location.search).get('lang')
        var locale
        if (query === 'ru' || query === 'en') {
          locale = query
        } else if (stored === 'ru' || stored === 'en') {
          locale = stored
        } else {
          locale = 'ru'
        }
        document.documentElement.lang = locale
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
